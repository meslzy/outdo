name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        bun: ["1.4.0", "latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bunx biome ci .
      - run: bun test
      - name: Coverage floor (serial — parallel shard merging is nondeterministic)
        if: matrix.os == 'ubuntu-latest' && matrix.bun == 'latest'
        run: bun run coverage
      - run: bun scripts/build.ts
      - name: Pack and install smoke test
        shell: bash
        run: |
          bun pm pack
          mkdir -p /tmp/scratch && cd /tmp/scratch
          printf '{ "name": "scratch", "private": true }' > package.json
          bun add "file:$GITHUB_WORKSPACE/$(ls "$GITHUB_WORKSPACE"/outdo-*.tgz | head -1 | xargs basename)"
          printf 'import { defineTasks } from "outdo";\nexport default defineTasks({ ok: { run: () => console.log("shim works") } });\n' > do.ts
          bunx outdo --color=never ok | grep "shim works"
